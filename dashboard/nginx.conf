# nginx serves the built React files.
# /api and /mcp do not come here: the Ingress sends them to the gateway.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Health check for Kubernetes probes
    location = /healthz {
        return 200 "ok\n";
    }

    # Any other path -> index.html (React handles the page)
    location / {
        try_files $uri /index.html;
    }
}
