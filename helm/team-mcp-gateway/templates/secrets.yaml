# secrets.yaml
# All passwords and tokens for the system, in one Kubernetes Secret.
#
# - On the first install, Helm makes random values (randAlphaNum).
# - On upgrade, "lookup" reads the old Secret and keeps the same values.
#   (Otherwise every upgrade would change the database password!)
# So no password is ever written in our source code or values files.
{{- $old := (lookup "v1" "Secret" .Release.Namespace "app-secrets").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
data:
  # Database
  MARIADB_ROOT_PASSWORD: {{ get $old "MARIADB_ROOT_PASSWORD" | default (randAlphaNum 24 | b64enc) }}
  WP_DB_PASSWORD: {{ get $old "WP_DB_PASSWORD" | default (randAlphaNum 24 | b64enc) }}
  # WordPress admin login (for /wp-admin)
  WP_ADMIN_PASSWORD: {{ get $old "WP_ADMIN_PASSWORD" | default (randAlphaNum 16 | b64enc) }}
  # WooCommerce REST API key, used only by our WooCommerce MCP server
  WOO_CONSUMER_KEY: {{ get $old "WOO_CONSUMER_KEY" | default (printf "ck_%s" (randAlphaNum 40 | lower) | b64enc) }}
  WOO_CONSUMER_SECRET: {{ get $old "WOO_CONSUMER_SECRET" | default (printf "cs_%s" (randAlphaNum 40 | lower) | b64enc) }}
  # Tokens the gateway uses to call each upstream MCP server
  WOO_MCP_TOKEN: {{ get $old "WOO_MCP_TOKEN" | default (randAlphaNum 32 | b64enc) }}
  NOTES_MCP_TOKEN: {{ get $old "NOTES_MCP_TOKEN" | default (randAlphaNum 32 | b64enc) }}
  UTILS_MCP_TOKEN: {{ get $old "UTILS_MCP_TOKEN" | default (randAlphaNum 32 | b64enc) }}
  # Gateway: key to encrypt upstream credentials, and first admin password
  GATEWAY_ENCRYPTION_KEY: {{ get $old "GATEWAY_ENCRYPTION_KEY" | default (randAlphaNum 48 | b64enc) }}
  GATEWAY_ADMIN_PASSWORD: {{ get $old "GATEWAY_ADMIN_PASSWORD" | default (randAlphaNum 16 | b64enc) }}
