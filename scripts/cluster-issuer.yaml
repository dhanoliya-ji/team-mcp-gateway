# cluster-issuer.yaml (production only)
# Tells cert-manager to get free TLS certificates from Let's Encrypt.
# (Optional) add "email: you@example.com" under acme to get expiry mails. Apply with:  kubectl apply -f scripts/cluster-issuer.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
